name: Build Android APK (HK Oil Manager)

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build React Application
        run: npm run build
        env:
          TARGET_PLATFORM: android
          CAPACITOR: 'true'

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/HK-Oil-Manager.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HK-Oil-Manager-APK
          path: release-apk/HK-Oil-Manager.apk
          if-no-files-found: error
          retention-days: 30
